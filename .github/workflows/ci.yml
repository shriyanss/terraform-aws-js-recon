name: CI

on:
  push:
    branches-ignore:
      - main

permissions:
  contents: read

jobs:
  version_check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Check version consistency
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "[i] Checking version consistency between version.txt and CHANGELOG.md"
          VERSION_TXT=$(cat version.txt | tr -d '[:space:]')
          CHANGELOG_VERSION=$(grep -E "^## [0-9]+\.[0-9]+\.[0-9]+" CHANGELOG.md | head -n 1 | sed -E 's/^## ([0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta)(\.[0-9]+)?)?).*/\1/')
          if [[ "$VERSION_TXT" != "$CHANGELOG_VERSION" ]]; then
            echo "Version mismatch: version.txt=${VERSION_TXT}, CHANGELOG.md=${CHANGELOG_VERSION}"
            exit 1
          fi
          echo "[✓] Version matches: ${VERSION_TXT}"
          echo "[i] Checking if this version already exists on GitHub..."
          if gh release view "v${VERSION_TXT}" >/dev/null 2>&1; then
            echo "Release v${VERSION_TXT} already exists on GitHub."
            exit 1
          fi
          echo "[✓] Version v${VERSION_TXT} not yet released."

  fmt:
    runs-on: ubuntu-latest
    needs: version_check
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2

      - name: Check formatting
        run: terraform fmt -check -recursive

  validate:
    runs-on: ubuntu-latest
    needs: fmt
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2

      - name: Validate module
        run: |
          terraform init -backend=false
          terraform validate

  validate_examples:
    runs-on: ubuntu-latest
    needs: validate
    strategy:
      matrix:
        example: [basic, scheduled]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2

      - name: Validate example — ${{ matrix.example }}
        working-directory: examples/${{ matrix.example }}
        run: |
          terraform init -backend=false
          terraform validate
